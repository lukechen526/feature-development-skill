name: Validate skill

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference validator
        if: matrix.python-version == '3.11'
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Agent Skills format
        if: matrix.python-version == '3.11'
        run: skills-ref validate "$GITHUB_WORKSPACE"
      - name: Compile helper
        run: python -m py_compile bin/featdev.py
      - name: Run self-check and local link checks
        run: python bin/featdev.py --self-check
